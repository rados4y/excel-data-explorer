name: Verify Explorer
on: [push, pull_request, workflow_dispatch]
jobs:
  core-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: npm ci
      - run: npm run demo
      - run: python -m unittest discover -s demo -p "test_*.py"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --no-default-features
      - run: npm test && npm run build && npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run demo
      - run: python -m unittest discover -s demo -p "test_*.py"
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked --features desktop
      - run: npm run build
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: npm run desktop:build
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
