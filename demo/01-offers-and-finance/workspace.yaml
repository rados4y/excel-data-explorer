# All paths are relative to this configuration file. Synthetic data only.
version: 1
workspace:
  id: sample-offers
  name: Sample 01 - Offers and finance
roots:
  data: ./data
  documents: ./documents
settings:
  timezone: Europe/Warsaw
  local_scan_seconds: 60
  network_scan_seconds: 300
  stable_file_check_ms: 1500
  stable_file_attempts: 3
  read_only: true
sources:
- id: offers
  path: ${data}/offers.xlsx
  sheet: Offers
  entity: offer
  namespace: primary
  header_row: 1
  key: id
  fields:
    id:
      column: OfferID
      type: string
      required: true
      trim: true
      label: Offer ID
    customer:
      column: Customer
      type: string
      searchable: true
    description:
      column: Description
      type: string
      searchable: true
    amount:
      column: Amount
      type: decimal
    status:
      column: Status
      type: string
      filterable: true
    created_at:
      column: CreatedAt
      type: date
      label: Created
- id: invoices
  path: ${data}/finance.xlsx
  sheet: Invoices
  entity: invoice
  namespace: primary
  key: id
  fields:
    id:
      column: InvoiceID
      type: string
      required: true
      trim: true
      label: Invoice ID
    offer_id:
      column: OfferID
      type: string
      required: true
      trim: true
    issued_at:
      column: InvoiceDate
      type: date
    amount:
      column: Amount
      type: decimal
    document_path:
      column: PDF
      type: string
- id: protocols
  path: ${data}/finance.xlsx
  sheet: Protocols
  entity: protocol
  namespace: primary
  key: id
  fields:
    id:
      column: ProtocolID
      type: string
      required: true
      trim: true
      label: Protocol ID
    offer_id:
      column: OfferID
      type: string
      required: true
      trim: true
    type:
      column: Type
      type: string
    document_path:
      column: PDF
      type: string
relationships:
- id: offer_invoices
  parent_entity: offer
  child_entity: invoice
  parent_field: id
  child_field: offer_id
- id: offer_protocols
  parent_entity: offer
  child_entity: protocol
  parent_field: id
  child_field: offer_id
documents:
- id: invoice_pdf
  entity: invoice
  path_field: document_path
  root: documents
  allowed_extensions:
  - pdf
- id: protocol_pdf
  entity: protocol
  path_field: document_path
  root: documents
  allowed_extensions:
  - pdf
  - docx
views:
  main:
    entity: offer
    title: Offers
    columns:
    - id
    - customer
    - description
    - amount
    - status
    - created_at
    default_sort:
      field: id
      direction: asc
    search_fields:
    - id
    - customer
    - description
    filters:
    - status
  detail:
    entity: offer
    title_field: id
    tabs:
    - title: Overview
      type: fields
    - title: Invoices
      type: relationship
      relationship: offer_invoices
    - title: Protocols
      type: relationship
      relationship: offer_protocols
    - title: Documents
      type: related_documents
