# Optional ready-made profile. Add data/project.xlsx directly to configure these links in-app.
version: 1
workspace: {id: sample-nested, name: Sample 06 - Nested offers and related lists}
roots: {data: ./data}
settings: {stable_file_check_ms: 1500}
sources:
- id: offers
  path: ${data}/project.xlsx
  sheet: Offers
  entity: offer
  namespace: offers
  key: id
  fields:
    id: {column: OfferID, type: string, required: true, searchable: true, label: OfferID}
    customer: {column: Customer, type: string, searchable: true}
    amount: {column: Amount, type: string}
- id: invoices
  path: ${data}/project.xlsx
  sheet: Invoices
  entity: invoice
  namespace: invoices
  key: id
  fields:
    id: {column: InvoiceID, type: string, required: true, label: InvoiceID}
    offer_id: {column: OfferID, type: string}
    amount: {column: Amount, type: string}
- id: protocols
  path: ${data}/project.xlsx
  sheet: Protocols
  entity: protocol
  namespace: protocols
  key: id
  fields:
    id: {column: ProtocolID, type: string, required: true, label: ProtocolID}
    offer_id: {column: OfferID, type: string}
    type: {column: Type, type: string}
relationships:
- id: nested_offer_invoices
  parent_entity: offer
  child_entity: invoice
  parent_field: id
  child_field: offer_id
  parent_source_id: offers
  child_source_id: invoices
- id: nested_offer_protocols
  parent_entity: offer
  child_entity: protocol
  parent_field: id
  child_field: offer_id
  parent_source_id: offers
  child_source_id: protocols
pages:
- id: offers
  title: Offers
  entity: offer
  source_id: offers
  columns: [id, customer, amount]
  default_sort: {field: id, direction: asc}
  search_fields: [id, customer]
  related_views:
  - {id: invoices, title: Invoices, relationship: nested_offer_invoices, page_id: invoices}
  - {id: protocols, title: Protocols, relationship: nested_offer_protocols, page_id: protocols}
- id: invoices
  title: Invoices
  entity: invoice
  source_id: invoices
  columns: [id, amount]
  default_sort: {field: id, direction: asc}
  hidden: true
- id: protocols
  title: Protocols
  entity: protocol
  source_id: protocols
  columns: [id, type]
  default_sort: {field: id, direction: asc}
  hidden: true
views:
  main:
    entity: offer
    title: Offers
    columns: [id, customer, amount]
    default_sort: {field: id, direction: asc}
    search_fields: [id, customer]
  detail:
    entity: offer
    title_field: id
    tabs: [{title: Overview, type: fields}, {title: Documents, type: related_documents}]
