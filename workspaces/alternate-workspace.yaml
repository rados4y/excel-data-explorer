version: 1
workspace: { id: alternate, name: Alternate column layout }
roots: { data: ../fixtures/demo/data, documents: ../fixtures/demo/documents }
sources:
  - id: orders
    path: '${data}/alternate.xlsx'
    sheet: Orders
    entity: order
    key: code
    fields:
      code: { column: Code, type: string, required: true }
      customer: { column: Client, type: string, searchable: true }
      amount: { column: Total, type: decimal }
views:
  main:
    entity: order
    title: Orders
    columns: [code, customer, amount]
    default_sort: { field: code, direction: asc }
    search_fields: [code, customer]
  detail:
    entity: order
    title_field: code
    tabs: [{ title: Overview, type: fields }, { title: Documents, type: related_documents }]
