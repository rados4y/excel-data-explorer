[package]
name = "excel-data-explorer"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
default-run = "excel-data-explorer"

[lib]
name = "explorer_core"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-autostart", "dep:tauri-plugin-dialog", "dep:tauri-plugin-window-state", "dep:tauri-plugin-opener", "dep:directories", "dep:tracing-appender", "dep:tracing-subscriber"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde-saphyr", version = "2.1" }
rusqlite = { version = "0.42", features = ["bundled"] }
calamine = { version = "0.38", features = ["dates"] }
rust_decimal = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.11"
hex = "0.4"
tempfile = "3"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
tracing-appender = { version = "0.2", optional = true }
directories = { version = "6", optional = true }
tauri = { package = "tauri", version = "2", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
rust_xlsxwriter = "0.102"
